<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>mc-survey-booked (placeholder)</title>
<link rel="stylesheet" href="_ui.css">
<style>:root{--w:720px;--h:440px}.split{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;height:100%}.cal{display:grid;gap:6px}.cal p{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:start}.cal span{color:#6A7380;font-size:12px;padding-top:7px}.cal em{font-style:normal;display:block;padding:7px 10px;border-radius:6px;background:#F4F5F7}.cal em.busy{color:#6A7380}.cal em.free{background:#FFFFFF;border:1px dashed #D5DAE1;color:#9AA2AD}.cal .on em{background:#FDE7DE;color:#7A2A0B;font-weight:500}.cal small{display:block;font-weight:400;font-size:11.5px;color:#A8370F}.bubble{background:#EEF0F3;border-radius:14px 14px 14px 4px;padding:12px 14px;line-height:1.5}</style>
</head><body>
<div class="app">
  <header class="top"><span class="mark"></span><span class="prod">Move Concierge AI</span><span class="org">· Sample Moving Co.</span><span class="tag">Sample data</span></header>
  <main class="body">
      <section class="panel">
        <h2>Google Calendar · estimators <span>Tue</span></h2>
        <div class="cal">
          <p><span>9:00</span><em class="busy">In-home estimate</em></p>
          <p class="on"><span>10:00</span><em>Virtual estimate · lead #1042<small>Booked by Move Concierge AI</small></em></p>
          <p><span>11:00</span><em class="free">Free</em></p>
          <p><span>12:00</span><em class="busy">Lunch</em></p>
          <p><span>13:00</span><em class="free">Free</em></p>
          <p><span>14:00</span><em class="busy">In-home estimate</em></p>
          <p><span>16:00</span><em class="free">Free</em></p>
        </div>
      </section>
  </main>
</div>
</body></html>
