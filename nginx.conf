server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Send relative Location headers, so redirects keep the scheme and host the visitor used
    # (TLS is terminated by the reverse proxy in front of this container).
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;
    gzip_min_length 1000;

    # Security headers (repeated in the static-asset location below —
    # a location-level add_header cancels inheritance of these)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest|xml|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Shared partials: served for SSI/fetch but kept out of search indexes
    location ~* ^/(header|footer)(\.html)?$ {
        ssi on;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Retired pages (2026-10 product-led site): permanent redirects to where their content moved.
    # Each matches /page, /page.html and /page/, keeps any query string (campaign tags) and lands on the
    # canonical .html URL. They inherit the server-level headers. Keep in step with .htaccess.
    location ~ ^/how-we-work(\.html|/)?$     { return 301 /custom-ai-systems.html$is_args$args; }
    location ~ ^/industries(\.html|/)?$      { return 301 /products.html$is_args$args; }
    location ~ ^/why-optimity(\.html|/)?$    { return 301 /about.html$is_args$args; }
    location ~ ^/management-team(\.html|/)?$ { return 301 "/about.html$is_args$args#team"; }

    # Clean URL support & fallback
    # Pages revalidate on every visit, so a cached page never pairs with newer CSS or JS.
    location / {
        ssi on;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Error pages
    error_page 404 /404.html;
}
