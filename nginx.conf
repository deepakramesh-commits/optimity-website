server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;
    gzip_min_length 1000;

    # Security headers (repeated in the static-asset location below —
    # a location-level add_header cancels inheritance of these)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest|xml|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Shared partials: served for SSI/fetch but kept out of search indexes
    location ~* ^/(header|footer)\.html$ {
        ssi on;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Clean URL support & fallback
    location / {
        ssi on;
        try_files $uri $uri.html $uri/ =404;
    }

    # Error pages
    error_page 404 /404.html;
}
